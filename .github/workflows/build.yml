name: Compilar APK de JANUS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Caché del modelo de voz local
        uses: actions/cache@v4
        with:
          path: vosk-model-small-es-0.42.zip
          key: vosk-model-small-es-0.42

      - name: Modelo de voz local (español)
        run: |
          [ -f vosk-model-small-es-0.42.zip ] || curl -fL -o vosk-model-small-es-0.42.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          rm -rf vosk-model-small-es-0.42 app/src/main/assets/model-es
          unzip -q vosk-model-small-es-0.42.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-es-0.42 app/src/main/assets/model-es
          du -sh app/src/main/assets/model-es

      - name: Caché de la voz incluida
        uses: actions/cache@v4
        with:
          path: |
            sherpa-onnx-1.13.8.aar
            vits-piper-es_ES-davefx-medium.tar.bz2
          key: sherpa-1.13.8-davefx-medium

      - name: Voz incluida (sherpa-onnx + Piper davefx)
        run: |
          [ -f sherpa-onnx-1.13.8.aar ] || curl -fL -o sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          [ -f vits-piper-es_ES-davefx-medium.tar.bz2 ] || curl -fL -o vits-piper-es_ES-davefx-medium.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2
          mkdir -p app/libs app/src/main/assets
          cp sherpa-onnx-1.13.8.aar app/libs/sherpa-onnx.aar
          rm -rf vits-piper-es_ES-davefx-medium app/src/main/assets/tts-es
          tar xjf vits-piper-es_ES-davefx-medium.tar.bz2
          mv vits-piper-es_ES-davefx-medium app/src/main/assets/tts-es
          ls app/src/main/assets/tts-es | head; du -sh app/src/main/assets/tts-es

      - name: API de sherpa-onnx (diagnóstico)
        continue-on-error: true
        run: |
          mkdir -p /tmp/aar && cd /tmp/aar && unzip -o -q $GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar classes.jar
          for c in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsVitsModelConfig GeneratedAudio; do javap -cp classes.jar com.k2fsa.sherpa.onnx.$c | head -40; done

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JANUS.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima JANUS.apk --title "JANUS (última versión)" --notes "Descargue JANUS.apk e instálelo en el móvil."
