name: Compilar APK de JANUS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Caché del modelo de voz local
        uses: actions/cache@v4
        with:
          path: vosk-model-small-es-0.42.zip
          key: vosk-model-small-es-0.42

      - name: Modelo de voz local (español)
        run: |
          [ -f vosk-model-small-es-0.42.zip ] || curl -fL -o vosk-model-small-es-0.42.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          rm -rf vosk-model-small-es-0.42 app/src/main/assets/model-es
          unzip -q vosk-model-small-es-0.42.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-es-0.42 app/src/main/assets/model-es
          du -sh app/src/main/assets/model-es

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JANUS.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima JANUS.apk --title "JANUS (última versión)" --notes "Descargue JANUS.apk e instálelo en el móvil."
